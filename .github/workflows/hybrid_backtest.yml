name: Hybrid BOS + MSNR Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests websocket-client

      - name: Run hybrid backtest
        run: python hybrid_backtest.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hybrid_backtest_report.md hybrid_backtest_signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update hybrid backtest [skip ci]"
          git push
