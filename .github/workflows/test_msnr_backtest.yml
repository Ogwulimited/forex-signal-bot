name: MSNR Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests websocket-client

      - name: Run MSNR backtest
        run: |
          cd msnr
          python backtest.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add msnr/backtest_report.md msnr/backtest_trades.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update MSNR backtest report [skip ci]"
          git push
